services:
  app:
    build:
      args:
        user: project-os
        uid: 1001
      context: docker-compose/app
      dockerfile: Dockerfile
    image: project-os
    container_name: project-os-app
    restart: unless-stopped
    working_dir: /var/www/
    ports:
      - 5173:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
      - ./phpstan_cache:/var/www/phpstan_cache
    networks:
      - project-os

  nginx:
    image: nginx
    container_name: project-os-nginx
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - ./docker-compose/nginx/logs:/var/log/nginx
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d/
      - ./public:/var/www/public:ro
      - ./storage/app:/var/www/storage/app:ro
    networks:
      - project-os

  db:
    image: postgres:16
    container_name: project-os-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./docker-compose/postgres:/var/lib/postgresql/data
    env_file:
      - ./.env.db
    networks:
      - project-os

  redis:
    image: redis:alpine
    container_name: project-os-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD:-password}"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - project-os

  supervisor:
    build:
      args:
        user: project-os
        uid: 1001
      context: docker-compose/supervisor
      dockerfile: Dockerfile
    image: project-os-supervisor
    container_name: project-os-supervisor
    restart: unless-stopped
    working_dir: /var/www/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
      - /var/www/node_modules
    depends_on:
      - db
      - redis
    networks:
      - project-os

  mailhog:
    restart: always
    build: docker-compose/mailhog
    image: project-os-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - project-os


networks:
  project-os:
    driver: bridge

volumes:
  redis-data:
  rabbitmq-data:

